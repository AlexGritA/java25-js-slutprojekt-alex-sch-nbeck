<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Top top rated movies</title>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4 text-center">The Movie Database</h1>
    

    <form id="search-form" class="d-flex justify-content-center mb-4">
        <select id="sort-type" class="form-select w-auto me-2">
            <option value="default">Sort by...</option>
            <option value="az">A-Z</option>
            <option value="za">Z-A</option>
            <option value="score-asc">Score ↑</option>
            <option value="score-desc">Score ↓</option>
        </select>
        <select id="search-type" class="form-select w-auto me-2">
            <option value="movie">Movies</option>
            <option value="person">People</option>
        </select>
        <input type="text" id="search-input" class="form-control w-25" placeholder="Search...">
        <button type="submit" class="btn btn-primary ms-2">Search</button>
    </form>

    <div id="search-container" class="d-flex flex-wrap gap-3 justify-content-center"></div>

        <h2 class="mb-3 text-center">Top Rated Movies</h2>
        <div id="top-rated-container" class="d-flex flex-wrap gap-3 justify-content-center"></div>

        <h2 class="mt-5 mb-3 text-center">Popular Movies</h2>
        <div id="popular-container" class="d-flex flex-wrap gap-3 justify-content-center"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
