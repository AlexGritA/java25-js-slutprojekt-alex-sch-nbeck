<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap CSS for styling and components -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Top top rated movies</title>
</head>

<body>
    <!-- Main container with padding -->
    <div class="container py-4">
        <!-- Clickable title that reloads the page -->
        <h1 id="site-title" class="mb-4 text-center">The Movie Database</h1>

        <!-- Search form with sort, type and input -->
        <form id="search-form" class="d-flex justify-content-center mb-4">
            <!-- Sort dropdown -->
            <select id="sort-type" class="form-select w-auto me-2">
                <option value="default">Sort by...</option>
                <option value="az">A-Z</option>
                <option value="za">Z-A</option>
                <option value="score-asc">Score ↑</option>
                <option value="score-desc">Score ↓</option>
            </select>
            <!-- Search type dropdown (Movies or People) -->
            <select id="search-type" class="form-select w-auto me-2">
                <option value="movie">Movies</option>
                <option value="person">People</option>
            </select>
            <input type="text" id="search-input" class="form-control w-25" placeholder="Search...">
            <button type="submit" class="btn btn-primary ms-2">Search</button>
        </form>

        <!-- Error message shown on failed or empty search -->
        <div id="error-message" class="text-center text-danger mt-2"></div>

        <!-- Container for search results -->
        <div id="search-container" class="d-flex flex-wrap gap-3 justify-content-center"></div>

        <!-- Top rated movies section -->
<h2 id="top-rated-title" class="mb-3 text-center">Top Rated Movies</h2>
<div id="top-rated-container" class="d-flex flex-wrap gap-3 justify-content-center"></div>

<!-- Popular movies section -->
<h2 id="popular-title" class="mt-5 mb-3 text-center">Popular Movies</h2>
<div id="popular-container" class="d-flex flex-wrap gap-3 justify-content-center"></div>
</div>
    <!-- Modal for displaying detailed movie/person information -->
    <div class="modal fade" id="detail-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-body">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS required for modal functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main JavaScript entry point -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
