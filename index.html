<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Top top rated movies</title>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark px-5 mb-4">
        <h1 id="site-title" class="navbar-brand mb-0 ms-100">FYM</h1>
        <div class="d-flex gap-3">
            <a href="#popular-container" class="text-white text-decoration-none">Popular</a>
            <a href="#top-rated-container" class="text-white text-decoration-none">Top Rated</a>
        </div>
    </nav>
    <div class="container py-4">
        <form id="search-form" class="d-flex justify-content-center mb-4">
        <select id="sort-type" class="form-select w-auto me-2">
            <option value="default">Sort by...</option>
            <option value="az">A-Z</option>
            <option value="za">Z-A</option>
            <option value="score-asc">Score ↑</option>
            <option value="score-desc">Score ↓</option>
        </select>
        <select id="search-type" class="form-select w-auto me-2">
            <option value="movie">Movies</option>
            <option value="person">People</option>
        </select>
        <input type="text" id="search-input" class="form-control w-25" placeholder="Search...">
        <button type="submit" class="btn btn-primary ms-2">Search</button>
        </form>

        <div id="error-message" class="text-center text-danger mt-2"></div>

        <div id="search-container" class="d-flex flex-wrap gap-3 justify-content-center"></div>

        <h2 id="popular-title" class="mt-5 mb-3 text-center">Popular Movies</h2>
        <div id="popular-container" class="d-flex flex-wrap gap-3 justify-content-center"></div>

        <h2 id="top-rated-title" class="mb-3 text-center">Top Rated Movies</h2>
        <div id="top-rated-container" class="d-flex flex-wrap gap-3 justify-content-center"></div>
    </div>

    <div class="modal fade" id="detail-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-body">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/main.js"></script>
</body>

</html>
